[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dependencies = ["numpy>=2", "scipy>=1.13"]

name = "crosspeak"
dynamic = ["version"]
description = "Generalized 2D correlation spectroscopy (Noda) for vibrational spectra"
readme = "README.md"
license = "MIT"
authors = [{ name = "Adam H. Turner", email = "aturner@ateneo.edu" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/turneradam/crosspeak"
Issues = "https://github.com/turneradam/crosspeak/issues"

[tool.hatch.version]
path = "src/crosspeak/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crosspeak"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "N807", # misfires on legitimate dunders like __post_init__, __repr__
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
